
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ course.name }} | Online Course</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Online Course Platform</a>
    </div>
</nav>

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="text-primary mb-3">{{ course.name }}</h1>

            <p class="lead">{{ course.description }}</p>

            <hr>

            <h2 class="h4 mb-3">Course Lessons</h2>

            {% for lesson in course.lessons.all %}
                <div class="card mb-3 border-0 shadow-sm">
                    <div class="card-body">
                        <h3 class="h5">
                            {{ forloop.counter }}. {{ lesson.title }}
                        </h3>
                        <p class="mb-0">{{ lesson.content }}</p>
                    </div>
                </div>
            {% empty %}
                <div class="alert alert-info">
                    No lessons are available for this course yet.
                </div>
            {% endfor %}
            
<a href="{% url 'exam' course.id %}" class="btn btn-success mt-3">
    Start Mock Exam
</a>
            <a href="/" class="btn btn-outline-primary mt-3">
                Back to Courses
            </a>
        </div>
    </div>
</div>

</body>
</html>
